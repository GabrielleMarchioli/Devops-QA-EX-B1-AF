server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # chamadas do front para a API vao para o container do Core
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # rotas do Vue
    location / {
        try_files $uri $uri/ /index.html;
    }
}